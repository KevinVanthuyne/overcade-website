# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy website

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install node dependencies
        run: npm ci

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick libmagickwand-dev

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.292.0
        with:
          ruby-version: '3.2' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems

      - name: Cache generated responsive images
        uses: actions/cache@v5
        with:
          path: _site/assets/resized
          key: responsive-images-${{ hashFiles('assets/images/**') }}
          restore-keys: |
            responsive-images-

      - name: Mark cached responsive images as up-to-date
        # jekyll-responsive-image skips regeneration only when the destination
        # file is newer than the source. After cache restore, source files
        # have a fresh checkout mtime, so we bump cached files into the future.
        run: |
          if [ -d _site/assets/resized ]; then
            find _site/assets/resized -type f -exec touch -d "tomorrow" {} +
          fi

      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build #--baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v6
        with:
          name: jekyll-build
          path: ./_site/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: jekyll-build
          path: ./_site/

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER_URL }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./httpdocs/
          local-dir: ./_site/
          protocol: ftps

