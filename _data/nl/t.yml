about:
  eyebrow: Over ons
  title: De échte arcade weer bij het grotere publiek brengen
  lead_line_1: Overcade staat voor authenticiteit en kwaliteit.
  lead_line_2: Originele arcade- en flipperkasten, nergens anders te huur in België.
  image_alt: Iemand speelt al lachend op de Pac-Man arcade
  mission:
    title: Onze missie
    body_1: >-
      Overcade gelooft in de unieke ervaring die een echte arcade- en
      flipperkast biedt. De nostalgie van de jaren 80 en 90, de fysieke
      gameplay en de authentieke uitstraling zorgen voor een bijzondere
      beleving op kantoor, thuis of evenementen.
    body_2: >-
      Met Overcade willen we onze passie voor arcades en flippers delen met
      een breder publiek. We bieden een unieke bron van ontspanning, een
      boost in sfeer en minder stress.
    body_3: >-
      Niets is zo teleurstellend als de goedkope namaak-arcadekasten die
      massaal (en vaak illegaal) in China worden geproduceerd. Deze kasten
      bevatten moderne schermen waarop retrographics totaal niet tot hun
      recht komen. De kwaliteit laat te wensen over door het gebruik van
      goedkope knoppen, joysticks en voedingen.
    body_4: >-
      Daarom kiezen wij ervoor om uitsluitend originele arcades en
      flipperkasten te verhuren. We restaureren de kasten volledig zelf en
      garanderen 100% authenticiteit door gebruik te maken van originele
      onderdelen en originele beeldbuizen.
  stats:
    arcades: Arcades in ons aanbod
    pinball: Flipperkasten in ons aanbod
    projects: Projecten in opslag
  owner:
    image_alt: Portretfoto van de eigenaar, Kevin Vanthuyne
    title: Hallo, ik ben Kevin Vanthuyne 👋
    body_1: >-
      Al vele jaren ben ik gepassioneerd door retro gaming en
      elektronica. Door het maken van allerlei projecten ben ik
      uiteindelijk beland in de wereld van arcades en flipperkasten.
    body_2: >-
      Ondertussen verzamel ik al een hele tijd arcades en
      flipperkasten, teveel om zowel aan te werken als overal op te
      spelen. Zo kwam ik op het idee om mijn passie met een breder
      publiek te delen en meer mensen te laten genieten van deze
      prachtige machines.

