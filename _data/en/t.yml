about:
  eyebrow: About us
  title: Bringing the real arcade back to a wider audience
  lead_line_1: Overcade stands for authenticity and quality.
  lead_line_2: Original arcade and pinball machines, available nowhere else in Belgium.
  image_alt: Someone laughing while playing the Pac-Man arcade
  mission:
    title: Our mission
    body_1: >-
      Overcade believes in the unique experience a real arcade or pinball
      machine offers. The nostalgia of the 80s and 90s, the physical
      gameplay and the authentic looks make for a special experience at the
      office, at home or at events.
    body_2: >-
      With Overcade we want to share our passion for arcades and pinball
      machines with a wider audience. We offer a unique source of relaxation,
      a better atmosphere and less stress.
    body_3: >-
      Nothing is as disappointing as the cheap imitation arcade cabinets
      produced en masse (and often illegally) in China. These cabinets use
      modern screens on which retro graphics never look right, and the
      quality suffers from cheap buttons, joysticks and power supplies.
    body_4: >-
      That is why we only rent out original arcade and pinball machines. We
      restore every cabinet ourselves and guarantee 100% authenticity by
      using original parts and original picture tubes.
  stats:
    arcades: Arcades in our range
    pinball: Pinball machines in our range
    projects: Projects in storage
  owner:
    image_alt: Portrait of the owner, Kevin Vanthuyne
    title: Hi, I'm Kevin Vanthuyne 👋
    body_1: >-
      I have been passionate about retro gaming and electronics for many
      years. Building all kinds of projects eventually landed me in the
      world of arcade and pinball machines.
    body_2: >-
      By now I have been collecting arcades and pinball machines for quite
      a while, too many to both work and play on everything. That is how I
      got the idea to share my passion with a wider audience and let more
      people enjoy these beautiful machines.

